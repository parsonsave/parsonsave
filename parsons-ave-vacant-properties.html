<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parsons Avenue — Vacant Properties</title>
<style>
  :root{
    --brick:#6e92ae;
    --brick-dark:#4f697d;
    --cream:#f3f6f1;
    --paper:#fffdf9;
    --ink:#262826;
    --mortar:#a7cdb7;
    --gold:#689760;
    --muted:#8a7f6f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;}

  header{
    background:var(--brick);
    color:var(--cream);
    padding:36px 24px 28px;
    text-align:center;
    border-bottom:4px solid var(--brick-dark);
  }
  header .eyebrow{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--mortar);
    margin-bottom:8px;
  }
  header h1{
    margin:0 0 6px 0;
    font-family:Georgia,serif;
    font-size:2rem;
  }
  header p.sub{
    margin:0 auto;
    font-size:0.92rem;
    color:var(--mortar);
    max-width:560px;
  }

  .controls{
    max-width:1080px;
    margin:0 auto;
    padding:24px 20px 0;
  }
  #search{
    width:100%;
    padding:12px 16px;
    font-size:1rem;
    border:1px solid var(--mortar);
    border-radius:4px;
    background:var(--paper);
    color:var(--ink);
    margin-bottom:16px;
  }
  #search:focus{outline:2px solid var(--brick);outline-offset:1px;}

  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
  }
  .pill{
    border:1px solid var(--mortar);
    background:var(--paper);
    color:var(--ink);
    padding:6px 14px;
    border-radius:20px;
    font-size:0.78rem;
    cursor:pointer;
    user-select:none;
  }
  .pill.active{
    background:var(--brick);
    border-color:var(--brick);
    color:#fff;
  }
  .pill:hover:not(.active){background:var(--mortar);}
  .pill:focus-visible{outline:2px solid var(--brick-dark);outline-offset:2px;}

  .count-row{
    max-width:1080px;
    margin:0 auto;
    padding:0 20px;
    font-size:0.8rem;
    color:var(--muted);
    margin-bottom:10px;
  }

  .grid{
    max-width:1080px;
    margin:0 auto;
    padding:0 20px 40px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
  }

  .card{
    background:var(--paper);
    border:1px solid var(--mortar);
    border-radius:6px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .card .cat{
    display:inline-block;
    align-self:flex-start;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    background:var(--mortar);
    color:var(--ink);
    padding:2px 8px;
    border-radius:10px;
    margin-bottom:4px;
  }
  .card .cat.land{background:#d5e6a3;}
  .card h3{
    margin:0;
    font-family:Georgia,serif;
    font-size:1.08rem;
    color:var(--brick-dark);
  }
  .card .meta{font-size:0.82rem;}
  .card .meta b{font-weight:700;color:var(--ink);}
  .card .links{
    margin-top:auto;
    padding-top:8px;
    font-size:0.8rem;
  }
  .card .links a{color:var(--brick-dark);text-decoration:none;}
  .card .links a:hover{text-decoration:underline;}

  .empty{
    max-width:1080px;
    margin:0 auto;
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-style:italic;
  }

  footer{
    text-align:center;
    font-size:0.75rem;
    color:var(--muted);
    padding:20px;
  }
</style>
</head>

<div class="grid" id="grid"></div>
<div class="empty" id="emptyMsg" style="display:none;"></div>

<footer>

  const categories = ["All", "Vacant Property", "Vacant Land"];
  let activeCategory = "All";
  let searchTerm = "";

  const pillsEl = document.getElementById("pills");
  const gridEl = document.getElementById("grid");
  const countRowEl = document.getElementById("countRow");
  const emptyMsgEl = document.getElementById("emptyMsg");
  const searchEl = document.getElementById("search");

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function categoryCount(cat) {
    if (cat === "All") return properties.length;
    return properties.filter(p => p.category === cat).length;
  }

  function renderPills() {
    pillsEl.innerHTML = categories.map(cat =>
      `<button class="pill ${cat === activeCategory ? 'active' : ''}" data-cat="${esc(cat)}">${esc(cat)} (${categoryCount(cat)})</button>`
    ).join("");
    pillsEl.querySelectorAll(".pill").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        render();
      });
    });
  }

  function matches(p) {
    const inCategory = activeCategory === "All" || p.category === activeCategory;
    const term = searchTerm.trim().toLowerCase();
    const inSearch = !term ||
      p.address.toLowerCase().includes(term) ||
      p.owner.toLowerCase().includes(term) ||
      p.parcel.toLowerCase().includes(term);
    return inCategory && inSearch;
  }

  function renderCards() {
    const filtered = properties.filter(matches);
    countRowEl.textContent = `${filtered.length} propert${filtered.length === 1 ? 'y' : 'ies'} shown`;

    if (filtered.length === 0) {
      emptyMsgEl.style.display = "block";
      emptyMsgEl.textContent = (activeCategory !== "All" && categoryCount(activeCategory) === 0 && !searchTerm.trim())
        ? `No ${activeCategory.toLowerCase()} listings yet.`
        : "No properties match your search.";
    } else {
      emptyMsgEl.style.display = "none";
    }

    gridEl.innerHTML = filtered.map(p => `
      <div class="card">
        <span class="cat ${p.category === 'Vacant Land' ? 'land' : ''}">${esc(p.category)}</span>
        <h3>${esc(p.address)}</h3>
        <div class="meta"><b>Parcel:</b> ${esc(p.parcel)}</div>
        <div class="meta"><b>Owner:</b> ${esc(p.owner)}</div>
        <div class="links"><a href="${esc(p.maps)}" target="_blank" rel="noopener">View on Maps</a></div>
      </div>
    `).join("");
  }

  function render() {
    renderPills();
    renderCards();
  }

  searchEl.addEventListener("input", (e) => {
    searchTerm = e.target.value;
    renderCards();
  });

  render();
</script>
